<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War 2D</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f16; color: #eee; font-family: monospace; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #3b4a2f; border: 2px solid #111; max-width: 100%; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game" width="900" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- Input ----------
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  if (!keys[k]) keyPressed(k);
  keys[k] = true;
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
});
canvas.addEventListener('mousedown', e => {
  Sound.init();
  if (state === 'menu' || state === 'over') {
    for (let i = 0; i < 3; i++) if (overCard(i)) selectedChar = i;
    return start();
  }
  if (state === 'upgrade') return clickUpgrade();
  if (e.button === 2) player.throwGrenade(); else mouse.down = true;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mouseup', () => mouse.down = false);

function keyPressed(k) {
  Sound.init();
  if (k === 'm') Sound.muted = !Sound.muted;
  if (state === 'menu' || state === 'over') {
    if (k >= '1' && k <= '3') selectedChar = +k - 1;
    if (k === 'arrowleft' || k === 'a') selectedChar = (selectedChar + 2) % 3;
    if (k === 'arrowright' || k === 'd') selectedChar = (selectedChar + 1) % 3;
    if (k === 'enter') start();
    return;
  }
  if (state === 'upgrade') { if (k >= '1' && k <= '3') pickUpgrade(+k - 1); return; }
  if (k === 'p') { state = state === 'paused' ? 'playing' : 'paused'; return; }
  if (state !== 'playing') return;
  if (k === 'r') player.reloadStart();
  if (k === 'g') player.throwGrenade();
  if (k === ' ') player.dash();
  if (k >= '1' && k <= '3') player.switchTo(+k - 1);
}

// ---------- Sound (synthesised, no files) ----------
const Sound = {
  ac: null, muted: false,
  init() { if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } },
  tone(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    if (!this.ac || this.muted) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur);
  },
  noise(dur, vol = 0.12) {
    if (!this.ac || this.muted) return;
    const n = this.ac.sampleRate * dur, buf = this.ac.createBuffer(1, n, this.ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ac.createBufferSource(), g = this.ac.createGain();
    g.gain.value = vol; s.buffer = buf; s.connect(g).connect(this.ac.destination); s.start();
  },
  shoot() { this.tone(420, 0.07, 'square', 0.04, -300); },
  shotgun() { this.noise(0.15, 0.1); this.tone(150, 0.12, 'sawtooth', 0.05, -100); },
  hit() { this.tone(200, 0.04, 'triangle', 0.04); },
  hurt() { this.tone(120, 0.18, 'sawtooth', 0.08, -60); },
  boom() { this.noise(0.4, 0.2); this.tone(90, 0.3, 'sine', 0.1, -60); },
  pickup() { this.tone(600, 0.08, 'sine', 0.06); setTimeout(() => this.tone(900, 0.1, 'sine', 0.06), 70); },
  dash() { this.tone(300, 0.12, 'sine', 0.05, 400); },
  wave() { [400, 500, 650].forEach((f, i) => setTimeout(() => this.tone(f, 0.15, 'square', 0.05), i * 110)); },
  reload() { this.tone(250, 0.05, 'square', 0.04); },
};

// ---------- Data ----------
let state = 'menu', player, bullets, enemyBullets, enemies, pickups, particles, grenades, boss;
let score, wave, enemiesToSpawn, spawnTimer, waveDelay, shake, kills, best = 0, choices = [];
try { best = +localStorage.getItem('war2d-best') || 0; } catch (e) {}

const WEAPONS = [
  { name: 'Rifle', rate: 0.14, spread: 0.04, pellets: 1, speed: 650, dmg: 1, mag: 30, snd: 'shoot' },
  { name: 'Shotgun', rate: 0.7, spread: 0.3, pellets: 6, speed: 550, dmg: 1, mag: 8, snd: 'shotgun' },
  { name: 'SMG', rate: 0.07, spread: 0.12, pellets: 1, speed: 600, dmg: 0.6, mag: 50, snd: 'shoot' },
];

const UPGRADES = [
  { name: 'Body Armor', desc: '+25 max HP and full heal', apply: p => { p.maxHp += 25; p.hp = p.maxHp; } },
  { name: 'Hollow Points', desc: '+25% weapon damage', apply: p => p.dmgMul *= 1.25 },
  { name: 'Trigger Finger', desc: '+20% fire rate', apply: p => p.rateMul *= 0.8 },
  { name: 'Running Shoes', desc: '+12% move speed', apply: p => p.speed *= 1.12 },
  { name: 'Grenade Pack', desc: '+3 grenades', apply: p => p.grenades += 3 },
  { name: 'Quick Hands', desc: '35% faster reload', apply: p => p.reloadMul *= 0.65 },
  { name: 'Field Medic', desc: 'Heal 60 HP', apply: p => p.hp = Math.min(p.maxHp, p.hp + 60) },
];

const CHARACTERS = [
  { name: 'Rifleman', color: '#4a7fd0', helmet: '#2b4f8a', hp: 100, speed: 190, weapon: 0, grenades: 3, dashCool: 1.2,
    desc: 'Balanced. Starts with rifle.' },
  { name: 'Heavy', color: '#6a8f4a', helmet: '#3d5a2a', hp: 170, speed: 150, weapon: 1, grenades: 2, dashCool: 1.6,
    desc: 'Tanky. Starts with shotgun.' },
  { name: 'Scout', color: '#d99a3a', helmet: '#8a5a1a', hp: 75, speed: 245, weapon: 2, grenades: 3, dashCool: 0.7,
    desc: 'Fast and agile. Starts with SMG.' },
];
let selectedChar = 0;
const cardX = i => 90 + i * 270;
const overCard = i => mouse.x >= cardX(i) && mouse.x <= cardX(i) + 240 && mouse.y >= 300 && mouse.y <= 500;

const TYPES = {
  soldier: { r: 12, hp: 2, speed: 80, color: '#b33', score: 10, shoots: true, rate: 1.8, range: 300, bspeed: 260, bdmg: 8 },
  runner: { r: 10, hp: 1, speed: 150, color: '#e83', score: 15, shoots: false, melee: 10 },
  sniper: { r: 11, hp: 2, speed: 60, color: '#a4a', score: 30, shoots: true, rate: 2.6, range: 560, bspeed: 520, bdmg: 14 },
  tank: { r: 22, hp: 12, speed: 45, color: '#654', score: 60, shoots: true, rate: 1.1, range: 400, bspeed: 260, bdmg: 15 },
  boss: { r: 40, hp: 60, speed: 35, color: '#822', score: 500, shoots: true, rate: 1.3, range: 700, bspeed: 280, bdmg: 12 },
};

// ---------- Player ----------
class Player {
  constructor(ch) {
    this.ch = ch;
    this.x = W / 2; this.y = H / 2; this.r = 14;
    this.hp = ch.hp; this.maxHp = ch.hp; this.speed = ch.speed;
    this.weaponIdx = ch.weapon; this.cool = 0; this.ammo = WEAPONS[ch.weapon].mag;
    this.reloading = 0; this.angle = 0; this.hurt = 0;
    this.dmgMul = 1; this.rateMul = 1; this.reloadMul = 1; this.grenades = ch.grenades;
    this.dashT = 0; this.dashCool = 0; this.dx = 1; this.dy = 0; this.phase = 0;
  }
  get weapon() { return WEAPONS[this.weaponIdx]; }
  reloadStart() { if (this.reloading <= 0 && this.ammo < this.weapon.mag) { this.reloading = 1.2 * this.reloadMul; Sound.reload(); } }
  update(dt) {
    let dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
    let dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    if (dx || dy) { this.dx = dx; this.dy = dy; this.phase += dt * 12; }
    let sp = this.speed;
    if (this.dashT > 0) { sp = 650; dx = this.dx; dy = this.dy; this.dashT -= dt; }
    this.dashCool -= dt;
    this.x = Math.max(this.r, Math.min(W - this.r, this.x + dx * sp * dt));
    this.y = Math.max(this.r, Math.min(H - this.r, this.y + dy * sp * dt));
    pushOut(this, this.r);
    this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
    this.cool -= dt; this.hurt -= dt;
    if (this.reloading > 0) {
      this.reloading -= dt;
      if (this.reloading <= 0) this.ammo = this.weapon.mag;
    } else if (mouse.down && this.cool <= 0) {
      if (this.ammo <= 0) this.reloadStart(); else this.shoot();
    }
  }
  switchTo(i) {
    if (i === this.weaponIdx) return;
    this.weaponIdx = i; this.ammo = this.weapon.mag; this.reloading = 0;
  }
  dash() {
    if (this.dashCool > 0) return;
    this.dashT = 0.16; this.dashCool = this.ch.dashCool; Sound.dash();
  }
  shoot() {
    const w = this.weapon;
    for (let i = 0; i < w.pellets; i++) {
      const a = this.angle + (Math.random() - 0.5) * 2 * w.spread;
      bullets.push({ x: this.x + Math.cos(a) * 20, y: this.y + Math.sin(a) * 20,
        vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed, dmg: w.dmg * this.dmgMul, life: 1 });
    }
    this.cool = w.rate * this.rateMul; this.ammo--; shake = Math.max(shake, 3); Sound[w.snd]();
  }
  throwGrenade() {
    if (this.grenades <= 0) return;
    this.grenades--;
    const d = Math.min(380, Math.hypot(mouse.x - this.x, mouse.y - this.y));
    grenades.push({ x: this.x, y: this.y, vx: Math.cos(this.angle) * 340, vy: Math.sin(this.angle) * 340, t: d / 340 });
  }
  damage(n) {
    if (this.dashT > 0) return;
    this.hp -= n; this.hurt = 0.15; shake = Math.max(shake, 6); Sound.hurt();
    if (this.hp <= 0) gameOver();
  }
  draw() {
    const w = this.weapon;
    drawSoldier(this.x, this.y, this.angle, {
      r: this.r, color: this.hurt > 0 ? '#f55' : this.ch.color, helmet: this.ch.helmet,
      gunLen: w.name === 'Shotgun' ? 30 : w.name === 'SMG' ? 22 : 28, phase: this.phase,
      alpha: this.dashT > 0 ? 0.4 : 1, muzzle: this.cool > w.rate * this.rateMul - 0.04,
    });
  }
}

// Top-down soldier sprite, drawn with canvas primitives. Faces +x before rotation.
function drawSoldier(x, y, a, o) {
  const r = o.r, s = Math.sin(o.phase || 0) * r * 0.45;
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.globalAlpha = o.alpha ?? 1;
  ctx.fillStyle = '#1a1a1a';                                   // boots (walk cycle)
  ctx.fillRect(-r * 0.5 + s, -r * 0.8, r * 0.75, r * 0.45);
  ctx.fillRect(-r * 0.5 - s, r * 0.35, r * 0.75, r * 0.45);
  ctx.fillStyle = '#2a2a2a'; ctx.fillRect(r * 0.2, -r * 0.16, o.gunLen || r * 1.8, r * 0.32); // gun
  ctx.fillStyle = '#555'; ctx.fillRect(r * 0.2 + (o.gunLen || r * 1.8) * 0.3, -r * 0.1, (o.gunLen || r * 1.8) * 0.4, r * 0.2);
  if (o.muzzle) { ctx.fillStyle = '#fd6'; ctx.beginPath(); ctx.arc(r * 0.2 + (o.gunLen || r * 1.8) + 3, 0, r * 0.4, 0, 7); ctx.fill(); }
  ctx.fillStyle = o.flash ? '#fff' : o.color;                  // torso
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.62, r * 1.0, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#e0b88a';                                   // hands
  ctx.beginPath(); ctx.arc(r * 0.55, -r * 0.4, r * 0.22, 0, 7); ctx.arc(r * 0.8, r * 0.1, r * 0.22, 0, 7); ctx.fill();
  ctx.fillStyle = o.flash ? '#fff' : (o.helmet || '#333');     // helmet
  ctx.beginPath(); ctx.arc(0, 0, r * 0.52, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.arc(-r * 0.1, -r * 0.12, r * 0.25, 0, 7); ctx.fill();
  if (o.visor) { ctx.fillStyle = o.visor; ctx.fillRect(r * 0.25, -r * 0.3, r * 0.28, r * 0.6); }
  ctx.restore();
}

function drawTank(e) {
  const r = e.r, big = e.type === 'boss';
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.moveAngle || 0);
  ctx.fillStyle = '#222'; ctx.fillRect(-r, -r, r * 2, r * 0.45); ctx.fillRect(-r, r * 0.55, r * 2, r * 0.45); // tracks
  ctx.fillStyle = e.flash > 0 ? '#fff' : e.color; ctx.fillRect(-r * 0.9, -r * 0.65, r * 1.8, r * 1.3);        // hull
  ctx.rotate((e.angle || 0) - (e.moveAngle || 0));
  ctx.fillStyle = e.flash > 0 ? '#fff' : (big ? '#a33' : '#876');
  ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, 7); ctx.fill();                                                  // turret
  ctx.fillStyle = '#222'; ctx.fillRect(0, -r * 0.1, r * 1.1, r * 0.2);                                        // barrel
  if (big) { ctx.fillRect(0, -r * 0.4, r * 0.8, r * 0.12); ctx.fillRect(0, r * 0.28, r * 0.8, r * 0.12); }
  ctx.restore();
}

function drawEnemy(e) {
  if (e.type === 'tank' || e.type === 'boss') return drawTank(e);
  const fl = e.flash > 0;
  if (e.type === 'runner') drawSoldier(e.x, e.y, e.angle, { r: e.r + 2, color: '#e08a30', helmet: '#7a3a10', gunLen: 8, phase: e.phase, flash: fl });
  else if (e.type === 'sniper') drawSoldier(e.x, e.y, e.angle, { r: e.r + 2, color: '#8a4a9a', helmet: '#4a1a5a', gunLen: 40, phase: e.phase, flash: fl, visor: '#6f6' });
  else drawSoldier(e.x, e.y, e.angle, { r: e.r + 2, color: '#b04040', helmet: '#5a1a1a', gunLen: 24, phase: e.phase, flash: fl });
}

// ---------- Map: buildings, trees, rocks, sandbags ----------
let obstacles = [], groundCanvas = null;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const isRect = o => o.kind === 'building' || o.kind === 'sandbag';

function obsBounds(o) {
  return isRect(o) ? { x: o.x, y: o.y, w: o.w, h: o.h } : { x: o.x - o.r, y: o.y - o.r, w: o.r * 2, h: o.r * 2 };
}

function generateMap() {
  obstacles = [];
  const placed = [];
  const fits = (b, gap) => {
    if (b.x < 50 || b.y < 50 || b.x + b.w > W - 50 || b.y + b.h > H - 50) return false;
    if (b.x < W / 2 + 110 && b.x + b.w > W / 2 - 110 && b.y < H / 2 + 110 && b.y + b.h > H / 2 - 110) return false; // keep spawn clear
    return placed.every(p => b.x > p.x + p.w + gap || b.x + b.w < p.x - gap || b.y > p.y + p.h + gap || b.y + b.h < p.y - gap);
  };
  const place = (make, n, gap = 36) => {
    let c = 0;
    for (let i = 0; i < 300 && c < n; i++) {
      const o = make(), b = obsBounds(o);
      if (fits(b, gap)) { placed.push(b); obstacles.push(o); c++; }
    }
  };
  const roofs = ['#8a4a3a', '#6a6f78', '#7a5a3a', '#4a6a7a'];
  place(() => ({ kind: 'building', x: rnd(60, W - 220), y: rnd(60, H - 170), w: rnd(90, 150), h: rnd(70, 110), roof: pick(roofs) }), 5);
  place(() => { const h = Math.random() < 0.5; return { kind: 'sandbag', x: rnd(60, W - 140), y: rnd(60, H - 140), w: h ? 90 : 20, h: h ? 20 : 90 }; }, 4);
  place(() => ({ kind: 'rock', x: rnd(70, W - 70), y: rnd(70, H - 70), r: rnd(14, 24) }), 6, 24);
  place(() => {
    const r = rnd(24, 34);
    return { kind: 'tree', x: rnd(70, W - 70), y: rnd(70, H - 70), r, tr: 8,
      blobs: Array.from({ length: 5 }, () => ({ a: rnd(0, 6.28), d: rnd(0.2, 0.55) * r, s: rnd(0.45, 0.7) * r })) };
  }, 16, 10);

  // ground texture, rendered once per map
  groundCanvas = document.createElement('canvas'); groundCanvas.width = W; groundCanvas.height = H;
  const g = groundCanvas.getContext('2d');
  g.fillStyle = '#3b4a2f'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 160; i++) {
    g.fillStyle = `rgba(${pick(['70,100,50', '30,50,25', '90,95,50'])},${rnd(0.12, 0.3)})`;
    g.beginPath(); g.ellipse(rnd(0, W), rnd(0, H), rnd(15, 60), rnd(10, 40), rnd(0, 3), 0, 7); g.fill();
  }
  g.strokeStyle = 'rgba(120,95,60,0.55)'; g.lineWidth = 34; g.lineCap = 'round';   // dirt road
  g.beginPath(); g.moveTo(-20, rnd(180, 420)); g.bezierCurveTo(250, rnd(100, 500), 600, rnd(100, 500), W + 20, rnd(180, 420)); g.stroke();
  g.strokeStyle = 'rgba(90,70,40,0.35)'; g.lineWidth = 4; g.setLineDash([14, 18]); g.stroke();
}

// Pushes a circle (e.x, e.y, r) out of obstacles. Returns the last contact normal or null.
function pushOut(e, r) {
  let hit = null;
  for (const o of obstacles) {
    if (isRect(o)) {
      const cx = Math.max(o.x, Math.min(e.x, o.x + o.w)), cy = Math.max(o.y, Math.min(e.y, o.y + o.h));
      let dx = e.x - cx, dy = e.y - cy;
      const d = Math.hypot(dx, dy);
      if (d >= r) continue;
      if (d === 0) {
        const l = e.x - o.x, rr = o.x + o.w - e.x, t = e.y - o.y, b = o.y + o.h - e.y, m = Math.min(l, rr, t, b);
        if (m === l) { dx = -1; dy = 0; } else if (m === rr) { dx = 1; dy = 0; } else if (m === t) { dx = 0; dy = -1; } else { dx = 0; dy = 1; }
        e.x += dx * (m + r); e.y += dy * (m + r); hit = { x: dx, y: dy };
      } else { e.x = cx + dx / d * r; e.y = cy + dy / d * r; hit = { x: dx / d, y: dy / d }; }
    } else {
      const min = (o.kind === 'tree' ? o.tr : o.r) + r, dx = e.x - o.x, dy = e.y - o.y, d = Math.hypot(dx, dy) || 0.01;
      if (d < min) { e.x = o.x + dx / d * min; e.y = o.y + dy / d * min; hit = { x: dx / d, y: dy / d }; }
    }
  }
  return hit;
}

// Buildings, rocks and sandbags stop bullets. Tree leaves don't.
function bulletBlocked(x, y) {
  for (const o of obstacles) {
    if (isRect(o)) { if (x > o.x && x < o.x + o.w && y > o.y && y < o.y + o.h) return true; }
    else if (o.kind === 'rock' && Math.hypot(x - o.x, y - o.y) < o.r) return true;
  }
  return false;
}

function drawObstacles() {
  for (const o of obstacles) {                       // shadows
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    if (isRect(o)) ctx.fillRect(o.x + 7, o.y + 7, o.w, o.h);
    else { ctx.beginPath(); ctx.ellipse(o.x + 9, o.y + 9, o.r, o.r * 0.9, 0, 0, 7); ctx.fill(); }
  }
  for (const o of obstacles) {
    if (o.kind === 'building') {
      ctx.fillStyle = '#2b2b2b'; ctx.fillRect(o.x, o.y, o.w, o.h);                       // walls
      ctx.fillStyle = o.roof; ctx.fillRect(o.x + 5, o.y + 5, o.w - 10, o.h - 10);        // roof
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
      for (let x = o.x + 20; x < o.x + o.w - 10; x += 16) { ctx.beginPath(); ctx.moveTo(x, o.y + 5); ctx.lineTo(x, o.y + o.h - 5); ctx.stroke(); }
      ctx.lineWidth = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(o.x + 5, o.y + 5, o.w - 10, 4);
      ctx.fillStyle = '#555'; ctx.fillRect(o.x + o.w - 28, o.y + 12, 16, 16);              // roof vent
      ctx.fillStyle = '#333'; ctx.fillRect(o.x + o.w - 24, o.y + 16, 8, 8);
    } else if (o.kind === 'sandbag') {
      ctx.fillStyle = '#b39b64'; ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = '#8a7544';
      const horiz = o.w > o.h;
      for (let i = 0; i < (horiz ? o.w : o.h); i += 15) {
        ctx.beginPath(); if (horiz) { ctx.moveTo(o.x + i, o.y); ctx.lineTo(o.x + i, o.y + o.h); } else { ctx.moveTo(o.x, o.y + i); ctx.lineTo(o.x + o.w, o.y + i); } ctx.stroke();
      }
      ctx.strokeRect(o.x, o.y, o.w, o.h);
    } else if (o.kind === 'rock') {
      ctx.fillStyle = '#7b7d80'; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#9a9ca0'; ctx.beginPath(); ctx.arc(o.x - o.r * 0.25, o.y - o.r * 0.25, o.r * 0.55, 0, 7); ctx.fill();
      ctx.strokeStyle = '#55575a'; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.stroke();
    } else if (o.kind === 'tree') {
      ctx.fillStyle = '#5a3a1a'; ctx.beginPath(); ctx.arc(o.x, o.y, o.tr, 0, 7); ctx.fill();   // trunk
    }
  }
}

// Tree leaves are drawn above units, so soldiers walking under them are partly hidden.
function drawCanopies() {
  for (const o of obstacles) {
    if (o.kind !== 'tree') continue;
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#2a5f26'; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill();
    for (const b of o.blobs) {
      ctx.fillStyle = '#367a2f'; ctx.beginPath(); ctx.arc(o.x + Math.cos(b.a) * b.d, o.y + Math.sin(b.a) * b.d, b.s, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#58ad4c'; ctx.beginPath(); ctx.arc(o.x - o.r * 0.25, o.y - o.r * 0.3, o.r * 0.3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- Game flow ----------
function spawnEnemy() {
  const roll = Math.random();
  let type = 'soldier';
  if (wave >= 3 && roll < 0.1) type = 'tank';
  else if (wave >= 4 && roll < 0.22) type = 'sniper';
  else if (roll < 0.45) type = 'runner';
  addEnemy(type);
}
function addEnemy(type) {
  const t = TYPES[type], side = Math.floor(Math.random() * 4), m = 40;
  const x = side === 0 ? -m : side === 1 ? W + m : Math.random() * W;
  const y = side === 2 ? -m : side === 3 ? H + m : Math.random() * H;
  const hp = type === 'boss' ? t.hp + wave * 5 : t.hp + Math.floor(wave / 4);
  const e = { ...t, type, x, y, hp, maxHp: hp, cool: Math.random() * (t.rate || 1), flash: 0, side: Math.random() < 0.5 ? 1 : -1, stuck: 0 };
  enemies.push(e);
  if (type === 'boss') boss = e;
}

function start() {
  generateMap();
  player = new Player(CHARACTERS[selectedChar]);
  bullets = []; enemyBullets = []; enemies = []; pickups = []; particles = []; grenades = []; boss = null;
  score = 0; wave = 0; kills = 0; shake = 0; waveDelay = 0; spawnTimer = 0; enemiesToSpawn = 0;
  state = 'playing'; nextWave();
}
function nextWave() {
  wave++; enemiesToSpawn = 5 + wave * 3; waveDelay = 0; Sound.wave();
  if (wave % 5 === 0) addEnemy('boss');
  state = 'playing';
}
function offerUpgrades() {
  choices = [...UPGRADES].sort(() => Math.random() - 0.5).slice(0, 3);
  state = 'upgrade';
}
function pickUpgrade(i) {
  if (!choices[i]) return;
  choices[i].apply(player); Sound.pickup(); nextWave();
}
function clickUpgrade() {
  for (let i = 0; i < 3; i++) {
    const x = 90 + i * 270;
    if (mouse.x >= x && mouse.x <= x + 240 && mouse.y >= 200 && mouse.y <= 420) return pickUpgrade(i);
  }
}
function gameOver() {
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('war2d-best', best); } catch (e) {} }
}

function boom(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = 40 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, color });
  }
}
function fire(e, angle, speed, dmg) {
  enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 3, dmg });
}
function explode(g) {
  const R = 95;
  boom(g.x, g.y, '#fa3', 40); boom(g.x, g.y, '#888', 20); shake = 14; Sound.boom();
  for (const e of enemies) {
    const d = Math.hypot(e.x - g.x, e.y - g.y);
    if (d < R + e.r) { e.hp -= 10 * player.dmgMul; e.flash = 0.1; }
  }
  const pd = Math.hypot(player.x - g.x, player.y - g.y);
  if (pd < R * 0.6) player.damage(15);
}

function update(dt) {
  player.update(dt);

  if (enemiesToSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnEnemy(); enemiesToSpawn--; spawnTimer = Math.max(0.3, 1.2 - wave * 0.06); }
  } else if (enemies.length === 0) {
    waveDelay += dt;
    if (waveDelay > 1.2) offerUpgrades();
  }

  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }
  for (const b of enemyBullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }
  for (const g of grenades) { g.x += g.vx * dt; g.y += g.vy * dt; g.t -= dt; if (g.t <= 0) { g.dead = true; explode(g); } }
  grenades = grenades.filter(g => !g.dead);

  for (const e of enemies) {
    const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.flash -= dt; e.angle = Math.atan2(dy, dx);
    if (!e.shoots || d > e.range * 0.6) {
      e.x += dx / d * e.speed * dt; e.y += dy / d * e.speed * dt;
      e.phase = (e.phase || 0) + dt * e.speed * 0.1; e.moveAngle = e.angle;
      // Collide with the map; when blocked, slide along the obstacle (and switch sides if stuck).
      const onMap = e.x > 0 && e.x < W && e.y > 0 && e.y < H;
      const hit = onMap ? pushOut(e, e.r > 20 ? e.r * 0.55 : e.r) : null;
      if (hit) {
        e.x += -hit.y * e.side * e.speed * dt * 0.9; e.y += hit.x * e.side * e.speed * dt * 0.9;
        e.stuck += dt; if (e.stuck > 1.5) { e.side = -e.side; e.stuck = 0; }
      } else e.stuck = Math.max(0, e.stuck - dt);
    }
    if (e.shoots) {
      e.cool -= dt;
      if (e.cool <= 0 && d < e.range) {
        const a = Math.atan2(dy, dx);
        if (e.type === 'boss') {
          for (let i = -1; i <= 1; i++) fire(e, a + i * 0.2, e.bspeed, e.bdmg);
          if (e.hp < e.maxHp / 2) for (let i = 0; i < 12; i++) fire(e, i * Math.PI / 6 + e.cool, 180, 8);
        } else {
          fire(e, a + (Math.random() - 0.5) * (e.type === 'sniper' ? 0.03 : 0.25), e.bspeed, e.bdmg);
        }
        e.cool = e.rate;
      }
    }
    if (e.melee && d < e.r + player.r) { player.damage(e.melee); e.hp = 0; boom(e.x, e.y, e.color); }
  }

  for (const b of bullets) {
    for (const e of enemies) {
      if (e.hp > 0 && b.life > 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 3) {
        e.hp -= b.dmg; b.life = 0; e.flash = 0.06; boom(b.x, b.y, '#ee8', 3); Sound.hit();
      }
    }
  }
  for (const b of enemyBullets) {
    if (b.life > 0 && Math.hypot(b.x - player.x, b.y - player.y) < player.r + 3) {
      b.life = 0; player.damage(b.dmg);
    }
  }

  for (const e of enemies) {
    if (e.hp <= 0 && !e.counted) {
      e.counted = true; kills++; score += e.score;
      boom(e.x, e.y, e.color, e.r > 20 ? 40 : 14);
      if (e.r > 20) { shake = 12; Sound.boom(); }
      if (e.type === 'boss') { pickups.push({ x: e.x, y: e.y, kind: 'hp' }, { x: e.x + 30, y: e.y, kind: 'ammo' }); boss = null; }
      else if (Math.random() < 0.2) {
        const r = Math.random();
        pickups.push({ x: e.x, y: e.y, kind: r < 0.5 ? 'hp' : r < 0.85 ? 'ammo' : 'gren' });
      }
    }
  }
  enemies = enemies.filter(e => e.hp > 0);

  for (const p of pickups) {
    if (Math.hypot(p.x - player.x, p.y - player.y) < player.r + 10) {
      p.got = true; Sound.pickup();
      if (p.kind === 'hp') player.hp = Math.min(player.maxHp, player.hp + 25);
      else if (p.kind === 'gren') player.grenades += 2;
      else { player.ammo = player.weapon.mag; player.reloading = 0; }
    }
  }
  pickups = pickups.filter(p => !p.got);

  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  const inb = b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20;
  const alive = b => {
    if (!inb(b)) return false;
    if (bulletBlocked(b.x, b.y) || bulletBlocked(b.x - b.vx * dt / 2, b.y - b.vy * dt / 2)) { boom(b.x, b.y, '#cb9', 3); return false; }
    return true;
  };
  bullets = bullets.filter(alive);
  enemyBullets = enemyBullets.filter(alive);
  shake = Math.max(0, shake - dt * 20);
}

// ---------- Drawing ----------
function text(s, x, y, size = 16, align = 'left', color = '#fff') {
  ctx.fillStyle = color; ctx.font = `${size}px monospace`; ctx.textAlign = align; ctx.fillText(s, x, y);
}

function drawWorld() {
  if (groundCanvas) ctx.drawImage(groundCanvas, 0, 0);
  drawObstacles();

  for (const p of pickups) {
    ctx.fillStyle = p.kind === 'hp' ? '#3c3' : p.kind === 'gren' ? '#c63' : '#fc3';
    ctx.fillRect(p.x - 8, p.y - 8, 16, 16);
    text(p.kind === 'hp' ? '+' : p.kind === 'gren' ? 'G' : 'A', p.x, p.y + 5, 14, 'center', '#000');
  }
  for (const e of enemies) drawEnemy(e);
  for (const g of grenades) { ctx.fillStyle = '#272'; ctx.beginPath(); ctx.arc(g.x, g.y, 6, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#ff6';
  for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
  ctx.fillStyle = '#f66';
  for (const b of enemyBullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 7); ctx.fill(); }
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); }
  ctx.globalAlpha = 1;
  if (state !== 'over') player.draw();
  drawCanopies();
}

function drawHUD() {
  ctx.fillStyle = '#400'; ctx.fillRect(15, 15, 200, 14);
  ctx.fillStyle = '#e44'; ctx.fillRect(15, 15, 200 * Math.max(0, player.hp) / player.maxHp, 14);
  text(`${Math.ceil(Math.max(0, player.hp))}/${player.maxHp}`, 20, 27, 11, 'left', '#fff');
  text(`${player.ch.name}   Score ${score}   Best ${best}`, 15, 50);
  text(`Wave ${wave}`, W - 15, 28, 16, 'right');
  const w = player.weapon;
  text(`${w.name}  ${player.reloading > 0 ? 'RELOADING' : player.ammo + '/' + w.mag}`, W - 15, 50, 16, 'right');
  text(`Grenades ${player.grenades}   Dash ${player.dashCool > 0 ? player.dashCool.toFixed(1) + 's' : 'READY'}`, W - 15, 72, 14, 'right', '#cdb');
  text('WASD move · LMB shoot · RMB/G grenade · Space dash · R reload · 1/2/3 weapon · P pause · M mute', W / 2, H - 10, 11, 'center', '#cdb');
  if (boss && boss.hp > 0) {
    ctx.fillStyle = '#222'; ctx.fillRect(W / 2 - 200, 66, 400, 12);
    ctx.fillStyle = '#c33'; ctx.fillRect(W / 2 - 200, 66, 400 * boss.hp / boss.maxHp, 12);
    text('BOSS', W / 2, 62, 12, 'center');
  }
}

function overlay(title, sub, hint, select) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  const top = select ? 90 : H / 2 - 40;
  text(title, W / 2, top, 56, 'center');
  if (sub) text(sub, W / 2, top + 40, 20, 'center');
  text(hint, W / 2, top + 90, 20, 'center', '#ee8');
  if (!select) return;
  text('Choose your soldier (click a card, 1-3 / A-D to select, Enter to start)', W / 2, 270, 14, 'center', '#cdb');
  const t = performance.now() / 300;
  CHARACTERS.forEach((c, i) => {
    const x = cardX(i), sel = i === selectedChar || overCard(i);
    ctx.fillStyle = sel ? '#4a5a3a' : '#2a3320'; ctx.fillRect(x, 300, 240, 200);
    ctx.strokeStyle = i === selectedChar ? '#ee8' : '#666'; ctx.lineWidth = i === selectedChar ? 3 : 1;
    ctx.strokeRect(x, 300, 240, 200); ctx.lineWidth = 1;
    drawSoldier(x + 120, 355, Math.sin(t + i) * 0.4, { r: 22, color: c.color, helmet: c.helmet, gunLen: 40, phase: t * 3 });
    text(`[${i + 1}] ${c.name}`, x + 120, 410, 20, 'center');
    text(c.desc, x + 120, 435, 12, 'center', '#cdb');
    text(`HP ${c.hp}  Speed ${c.speed}  ${WEAPONS[c.weapon].name}`, x + 120, 460, 12, 'center', '#ee8');
    text(`Grenades ${c.grenades}  Dash ${c.dashCool}s`, x + 120, 480, 12, 'center', '#ee8');
  });
}

function drawUpgrade() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
  text(`WAVE ${wave} CLEARED`, W / 2, 120, 40, 'center');
  text('Choose an upgrade (click or press 1-3)', W / 2, 160, 18, 'center', '#ee8');
  choices.forEach((c, i) => {
    const x = 90 + i * 270, hover = mouse.x >= x && mouse.x <= x + 240 && mouse.y >= 200 && mouse.y <= 420;
    ctx.fillStyle = hover ? '#4a5a3a' : '#2a3320'; ctx.fillRect(x, 200, 240, 220);
    ctx.strokeStyle = '#ee8'; ctx.strokeRect(x, 200, 240, 220);
    text(`[${i + 1}]`, x + 120, 240, 18, 'center', '#ee8');
    text(c.name, x + 120, 290, 20, 'center');
    const words = c.desc.split(' '); let line = '', y = 335;
    for (const wd of words) {
      if ((line + wd).length > 22) { text(line, x + 120, y, 14, 'center', '#cdb'); line = ''; y += 20; }
      line += wd + ' ';
    }
    text(line, x + 120, y, 14, 'center', '#cdb');
  });
}

function draw() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (state !== 'menu') drawWorld();
  ctx.restore();
  if (state !== 'menu') drawHUD();
  if (state === 'menu') overlay('WAR 2D', 'Survive the waves. Beat the bosses.', 'Pick a soldier to begin', true);
  if (state === 'over') overlay('GAME OVER', `Score ${score} · Wave ${wave} · Kills ${kills} · Best ${best}`, 'Pick a soldier to play again', true);
  if (state === 'paused') overlay('PAUSED', '', 'Press P to resume');
  if (state === 'upgrade') drawUpgrade();
}

let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (state === 'playing') update(dt);
  draw();
  requestAnimationFrame(loop);
}
// Dummy state so the menu can render before the first game starts.
player = new Player(CHARACTERS[0]); score = 0; wave = 0; kills = 0; shake = 0; boss = null;
bullets = []; enemyBullets = []; enemies = []; pickups = []; particles = []; grenades = [];
requestAnimationFrame(loop);
</script>
</body>
</html>
